name: daily-planner CI/CD

# CI (lint + tests) on every push/PR that touches the app; CD (build & push a
# Docker image to GHCR) only on pushes to main.
on:
  push:
    branches: ["**"]
    paths:
      - "daily-planner/**"
      - ".github/workflows/daily-planner.yml"
  pull_request:
    paths:
      - "daily-planner/**"
      - ".github/workflows/daily-planner.yml"

defaults:
  run:
    working-directory: daily-planner

jobs:
  ci:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daily-planner/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint + import order)
        run: ruff check .

      - name: Pytest
        run: pytest

  docker:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: ci
    # Only publish from the default branch, never from PRs or feature branches.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/daily-planner
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: daily-planner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
