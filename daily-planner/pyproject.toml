[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pyflakes (real bugs: undefined names, unused imports), pycodestyle errors,
# and isort. Style-only noise is kept out so the gate stays meaningful.
select = ["E", "F", "I"]
# The sources deliberately catch broad exceptions to degrade gracefully.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
