<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Daily Planner</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --text:#e6e8ec;
            --muted:#9aa3b2; --accent:#3fb950; --err:#e5534b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); min-height:100vh;
           display:flex; align-items:center; justify-content:center;
           font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
            padding:28px; width:320px; }
    h1 { font-size:19px; margin:0 0 4px; }
    p.sub { color:var(--muted); margin:0 0 20px; font-size:14px; }
    label { display:block; font-size:13px; color:var(--muted); margin:12px 0 5px; }
    input { width:100%; background:#0f1115; color:var(--text); border:1px solid var(--line);
            border-radius:8px; padding:10px 12px; font-size:14px; }
    button { width:100%; margin-top:18px; cursor:pointer; border:none; border-radius:8px;
             padding:11px; font-size:14px; font-weight:600; background:var(--accent); color:#04210d; }
    .err { color:var(--err); font-size:13px; margin-top:14px; }
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1>Daily Planner</h1>
    <p class="sub">Sign in to manage your tasks.</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
