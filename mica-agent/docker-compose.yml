# Production shape (proposal §6): web + Postgres + Redis + Celery worker.
# Bind to 127.0.0.1 only; Caddy terminates TLS in front on the Hetzner box.
#
# Deploy on the shared box pulls the CI-built image (like every other stack):
#   export MICA_TAG=<git-sha>            # tag CI published to GHCR
#   docker compose pull && docker compose up -d
# `build: .` is kept as a local fallback (`docker compose up --build`).
#
# web/worker join the urbantrends backend's docker network so they can reach it
# by service name (URBANTRENDS_API_BASE=http://urbantrends-backend:8000). Find
# the real network name with `docker network ls` (it's usually
# <backend-compose-project>_default) and set URBANTRENDS_NETWORK in .env to it.
# If you point URBANTRENDS_API_BASE at https://urbantrends.dev instead, the
# external network isn't needed — drop it from web/worker below.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mica}
      POSTGRES_DB: mica
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - internal
    restart: unless-stopped

  web:
    image: ghcr.io/urbantrendsorganization-production/agentic-ai/mica-agent:${MICA_TAG:-latest}
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    environment:
      DATABASE_URL: postgres://mica:${POSTGRES_PASSWORD:-mica}@db:5432/mica
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    # Host 8000 is taken by urbantrends-backend on the shared box; publish 8002.
    # Container still listens on 8000; the host reverse proxy targets 8002.
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - internal
      - urbantrends
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    image: ghcr.io/urbantrendsorganization-production/agentic-ai/mica-agent:${MICA_TAG:-latest}
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://mica:${POSTGRES_PASSWORD:-mica}@db:5432/mica
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    networks:
      - internal
      - urbantrends
    depends_on:
      - db
      - redis
    restart: unless-stopped

networks:
  # Private network for mica's own services (web/worker ↔ db/redis).
  internal:
    driver: bridge
  # The urbantrends backend's existing network, created by its own compose
  # project. `external: true` means compose joins it rather than creating it.
  urbantrends:
    external: true
    name: ${URBANTRENDS_NETWORK:-urbantrends_default}

volumes:
  pgdata:
