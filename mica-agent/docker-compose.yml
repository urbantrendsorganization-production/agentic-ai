# Production shape (proposal §6): web + Postgres + Redis + Celery worker.
# Bind to 127.0.0.1 only; Caddy terminates TLS in front on the Hetzner box.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mica}
      POSTGRES_DB: mica
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: .env
    environment:
      DATABASE_URL: postgres://mica:${POSTGRES_PASSWORD:-mica}@db:5432/mica
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: celery -A config worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgres://mica:${POSTGRES_PASSWORD:-mica}@db:5432/mica
      REDIS_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  pgdata:
